[package]
name = "herdr-shepherd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Herdr upkeep and coding agent orchestration"

[[bin]]
name = "herdr-shepherd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
globset = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
