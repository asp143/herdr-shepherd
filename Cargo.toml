[package]
name = "herdr-shepherd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Herdr upkeep and coding agent orchestration"

[[bin]]
name = "herdr-shepherd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
